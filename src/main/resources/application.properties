# ==============================================================================
# Student Management System - Application Configuration
# ==============================================================================

server.port=8080
spring.application.name=student-management-system

# Configurable directory for CSV File I/O persistence
app.data.dir=data

# Keep banner clean and clear for viva demonstration
spring.main.banner-mode=console

# Serve static frontend resources directly from classpath:/static/
spring.web.resources.static-locations=classpath:/static/
